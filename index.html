<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090a0d">
    <meta name="description" content="A generative field of traveling color and light.">
    <title>Drift — Generative Color Field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="experience">
      <header class="topbar" aria-hidden="true"></header>

      <section class="artwork" aria-label="Animated generative color field">
        <canvas id="field" aria-label="Colorful animated spiked lines drifting across a dark field"></canvas>
        <div class="artwork-vignette" aria-hidden="true"></div>
        <div class="artwork-meta">
          <div class="palette-block">
            <span class="swatches" id="swatches" aria-label="Palette colors"></span>
          </div>
        </div>
      </section>

      <footer class="footer" aria-hidden="true"></footer>
    </main>
    <script src="sketch.js?v=7"></script>
  </body>
</html>
